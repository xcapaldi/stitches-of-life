<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stitches of Life — hat designer</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧶</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Stitches of Life</h1>
        <p>Grow a knitted hat chart with cellular automata</p>
      </div>
      <div class="topbar-actions">
        <button id="btnExportMd" type="button">Export pattern</button>
        <button id="btnExportPng" type="button">Export chart</button>
        <button id="btnExportJson" type="button">Save project</button>
        <label class="file-button">
          Open project
          <input id="fileImport" type="file" accept="application/json,.json" hidden />
        </label>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <details open>
          <summary>Hat</summary>
          <div class="grid">
            <label>A — head circumference (in)<input id="headCircumference" type="number" step="0.25" min="6" max="40" value="22" /></label>
            <label>B — ear to ear (in)<input id="earToEar" type="number" step="0.25" min="4" max="30" value="14" /></label>
            <label>Ease (in)<input id="ease" type="number" step="0.25" min="-4" max="4" value="1" /></label>
            <label>Stitch gauge (st/in)<input id="stitchGauge" type="number" step="0.25" min="1" max="20" value="5" /></label>
            <label>Row gauge (rounds/in)<input id="rowGauge" type="number" step="0.25" min="1" max="30" value="7" /></label>
            <label>Cuff length (in)<input id="cuffInches" type="number" step="0.25" min="0.25" max="12" value="4.5" /></label>
            <label>Cuff<select id="cuffStyle"></select></label>
            <label>Crown<select id="crownStyle"></select></label>
            <label>Rib knit<input id="ribKnit" type="number" step="1" min="1" max="8" value="2" /></label>
            <label>Rib purl<input id="ribPurl" type="number" step="1" min="1" max="8" value="2" /></label>
          </div>
          <label class="check"><input id="cuffInMap" type="checkbox" checked /> Ribbing/cuff is part of the map</label>
          <label class="check"><input id="crownInMap" type="checkbox" checked /> Crown is part of the map</label>
          <label>Worked as<select id="stitchMode">
              <option value="colorwork">Colourwork (MC / CC)</option>
              <option value="texture">Texture (knit / purl)</option>
            </select></label>
        </details>

        <details open>
          <summary>Simulation</summary>
          <label>Automaton<select id="simMode">
              <option value="2d">2D — life on the whole map</option>
              <option value="1d">1D — one round at a time</option>
            </select></label>

          <div id="panel2d">
            <label>Preset<select id="rulePreset2d"></select></label>
            <label>Rule<input id="rule2d" type="text" value="B3/S23" spellcheck="false" /></label>
          </div>

          <div id="panel1d" hidden>
            <label>Preset<select id="rulePreset1d"></select></label>
            <label>Rule number (0–255)<input id="rule1d" type="number" min="0" max="255" step="1" value="30" /></label>
            <label>First generation<select id="direction1d">
                <option value="up">Bottom — grows towards the crown</option>
                <option value="down">Top — grows towards the cuff</option>
              </select></label>
          </div>

          <div class="grid">
            <label>Seed<select id="seedType"></select></label>
            <label>Density<input id="seedDensity" type="range" min="0.02" max="0.9" step="0.01" value="0.35" /></label>
            <label>Random seed<input id="rngSeed" type="number" step="1" min="0" value="1" /></label>
            <label>Speed (gen/s)<input id="speed" type="range" min="1" max="60" step="1" value="8" /></label>
          </div>
          <button id="btnReseed" type="button" class="wide">Re-seed and restart</button>
        </details>

        <details open>
          <summary>View</summary>
          <label class="check"><input id="showGrid" type="checkbox" checked /> Grid lines</label>
          <label class="check"><input id="showGlyphs" type="checkbox" checked /> Stitch glyphs when zoomed in</label>
          <label class="check"><input id="showSections" type="checkbox" checked /> Section markers</label>
          <div class="grid">
            <label>Main colour<input id="colorMC" type="color" value="#f4f1ea" /></label>
            <label>Contrast<input id="colorCC" type="color" value="#1f2933" /></label>
          </div>
          <label>Pointer<select id="paintMode">
              <option value="draw">Draw stitches</option>
              <option value="pan">Pan</option>
            </select></label>
        </details>

        <details open>
          <summary>Pattern notes</summary>
          <div class="grid">
            <label>Knit by<input id="knitBy" type="text" /></label>
            <label>Knit for<input id="knitFor" type="text" /></label>
            <label>Date<input id="date" type="date" /></label>
            <label>Yarn<input id="yarn" type="text" /></label>
            <label>Needles<input id="needles" type="text" /></label>
          </div>
        </details>

        <details open>
          <summary>Numbers</summary>
          <dl id="stats" class="stats"></dl>
        </details>
      </aside>

      <section class="stage">
        <canvas id="chart"></canvas>
        <div class="stage-tools">
          <button id="btnFit" type="button" title="Fit the chart to the window">Fit</button>
        </div>
        <div id="hint" class="hint">Drag to draw · shift-drag or right-drag to pan · scroll to zoom</div>
      </section>
    </main>

    <footer class="transport">
      <div class="controls">
        <button id="btnReset" type="button" title="Back to the first generation (R)">⟲</button>
        <button id="btnBack" type="button" title="One generation back (←)">◀</button>
        <button id="btnPlay" type="button" class="primary" title="Play or pause (space)">▶</button>
        <button id="btnForward" type="button" title="One generation on (→)">▶|</button>
        <button id="btnRun" type="button" title="Run ahead 100 generations">≫</button>
      </div>
      <input id="genSlider" type="range" min="0" max="0" step="1" value="0" />
      <canvas id="timeline" title="Population per generation — click to scrub"></canvas>
      <div id="status" class="status"></div>
    </footer>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
